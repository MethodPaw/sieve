name: Distribute SIEVE skill

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: skill-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  package-and-upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the released revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Test
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package the skill
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/package_skill.py --version "$RELEASE_TAG" --output dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256
